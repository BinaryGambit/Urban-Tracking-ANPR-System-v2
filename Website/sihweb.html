});

function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generateRoute(plate) {
  const rng = mulberry32(hashSeed(plate.toUpperCase().trim() || "TN00AA0000"));
  const ids = CAMERAS.map((c) => c.id);
  let current = ids[Math.floor(rng() * ids.length)];
  const steps = 4 + Math.floor(rng() * 3);
  const path = [current];
  for (let i = 0; i < steps; i++) {
    const neighbors = (ADJ[current] || []).filter((n) => n !== path[path.length - 2]);
    const pool = neighbors.length ? neighbors : ADJ[current] || ids;
    current = pool[Math.floor(rng() * pool.length)];
    path.push(current);
  }
  let hour = 6 + Math.floor(rng() * 14);
  let min = Math.floor(rng() * 60);
  return path.map((camId, i) => {
    if (i > 0) {
      min += 6 + Math.floor(rng() * 16);
      if (min >= 60) { hour += Math.floor(min / 60); min = min % 60; }
    }
    return {
      camera: camId,
      time: `${String(hour % 24).padStart(2, "0")}:${String(min).padStart(2, "0")}`,
      speed: 22 + Math.floor(rng() * 40),
      confidence: (91 + rng() * 8.5).toFixed(1),
    };
  });
}

const VEHICLE_TREND = (() => {
  const out = [];
  for (let h = 0; h < 24; h++) {
    const morning = Math.exp(-((h - 9) ** 2) / 8) * 420;
    const evening = Math.exp(-((h - 18.5) ** 2) / 6) * 480;
    const base = 140 + morning + evening;
    out.push({
      hour: `${String(h).padStart(2, "0")}:00`,
      inbound: Math.round(base * 0.55 + Math.sin(h) * 12),
      outbound: Math.round(base * 0.45 + Math.cos(h) * 10),
    });
  }
  return out;
})();

/* ======================================================================
   CITY MAP (stylized SVG — shared "signature" component)
   ====================================================================== */

function CityMap({ highlightPath = [], mode = "default", height = 420, activeCamera = null, onNodeClick = null }) {
  const theme = React.useContext(ThemeContext);
  const pathSet = new Set(highlightPath.map((h) => h.camera || h));
  const pathIds = highlightPath.map((h) => h.camera || h);

  return (
    <div className="relative w-full overflow-hidden rounded-xl border border-slate-800 bg-slate-950/60" style={{ height }}>
      <svg viewBox="0 0 700 500" className="h-full w-full" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
            <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" strokeWidth="0.5" opacity="0.5" />
          </pattern>
          <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill={theme.hex} />
          </marker>
        </defs>

        <rect x="0" y="0" width="700" height="500" fill="url(#gridPattern)" />

        {/* base road network */}
        {ROADS.map(([a, b], i) => {
          const A = CAM[a], B = CAM[b];
          const cx = (A.x / 700) * 700, cy = (A.y / 500) * 500;
          return (
            <line key={i} x1={A.x} y1={A.y} x2={B.x} y2={B.y}
              stroke="#334155" strokeWidth="2.5" strokeLinecap="round" opacity="0.55" />
          );
        })}

        {/* density heat glow */}
        {mode === "density" && CAMERAS.map((c) => {
          const d = ZONE_DENSITY[c.zone] ?? 0.3;
          const color = d > 0.75 ? "#f43f5e" : d > 0.5 ? "#f59e0b" : d > 0.3 ? theme.hex : "#34d399";
          return (
            <circle key={"heat" + c.id} cx={c.x} cy={c.y} r={18 + d * 32} fill={color} opacity={0.16 + d * 0.18} />
          );
        })}

        {/* highlighted trajectory path */}
        {pathIds.slice(0, -1).map((id, i) => {
          const A = CAM[id], B = CAM[pathIds[i + 1]];
          if (!A || !B) return null;
          return (
            <line key={"hl" + i} x1={A.x} y1={A.y} x2={B.x} y2={B.y}
              stroke={theme.hex} strokeWidth="3.5" strokeLinecap="round"
              markerEnd="url(#arrowHead)" opacity="0.95">
              <animate attributeName="stroke-dasharray" from="0,12" to="12,0" dur="0.6s" begin={`${i * 0.15}s`} fill="freeze" />
            </line>
          );
        })}

        {/* camera nodes */}
        {CAMERAS.map((c) => {
          const inPath = pathSet.has(c.id);
          const order = pathIds.indexOf(c.id);
          const isActive = activeCamera === c.id;
          return (
            <g key={c.id} onClick={() => onNodeClick && onNodeClick(c.id)} style={{ cursor: onNodeClick ? "pointer" : "default" }}>
              {(inPath || isActive) && (
                <circle cx={c.x} cy={c.y} r={isActive ? 13 : 9} fill="none" stroke={theme.hex} strokeWidth="1.5" opacity="0.6">
                  <animate attributeName="r" values={`${isActive ? 13 : 9};${isActive ? 20 : 15};${isActive ? 13 : 9}`} dur="2s" repeatCount="indefinite" />
                  <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
                </circle>
              )}
              <circle cx={c.x} cy={c.y} r={inPath ? 6 : 4.5}
                fill={inPath ? theme.hex : "#64748b"}
                stroke={inPath ? "#0891b2" : "#1e293b"}
                strokeWidth="1.5"
                filter={inPath ? "url(#nodeGlow)" : undefined} />
              {inPath && order >= 0 && (
                <text x={c.x} y={c.y - 12} textAnchor="middle" className="font-data" fontSize="8" fill="#67e8f9">
                  {order + 1}
                </text>
              )}
              <text x={c.x} y={c.y + (inPath ? 18 : 14)} textAnchor="middle" className="font-data" fontSize="7.5" fill="#94a3b8">
                {c.id}
              </text>
            </g>
          );
        })}
      </svg>

      {mode === "density" && (
        <div className="absolute bottom-3 left-3 flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/80 px-3 py-1.5 font-data text-[10px] text-slate-400">
          <span className="h-2 w-2 rounded-full bg-emerald-400" /> Free
          <span className={`ml-2 h-2 w-2 rounded-full bg-${theme.c400}`} /> Moderate
          <span className="ml-2 h-2 w-2 rounded-full bg-amber-400" /> Heavy
          <span className="ml-2 h-2 w-2 rounded-full bg-rose-500" /> Gridlock
        </div>
      )}
      <div className="absolute top-3 right-3 flex items-center gap-1.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-1 font-data text-[10px] text-emerald-300">
        <span className="relative flex h-1.5 w-1.5">
          <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75" />
          <span className="relative inline-flex h-1.5 w-1.5 rounded-full bg-emerald-400" />
        </span>
        LIVE FEED
      </div>
    </div>
  );
}

function AnprModule() {
  const theme = React.useContext(ThemeContext);
  const [selected, setSelected] = useState(null);
  const [stage, setStage] = useState(0);
  const stages = ["Detecting plate region", "Cropping & normalizing", "Enhancing image", "Running OCR", "Validating format"];

  useEffect(() => {
    if (!selected) return;
    setStage(0);
    const timers = stages.map((_, i) =>
      setTimeout(() => setStage(i + 1), (i + 1) * 420)
    );
    return () => timers.forEach(clearTimeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selected]);

  const done = selected && stage >= stages.length;

  return (
    <div className="space-y-6">
      <SectionHeader eyebrow="Module 01" icon={ScanLine} title="High-Accuracy ANPR / OCR Engine"
        desc="Pick a sample capture (simulating a real camera frame) and watch the recognition pipeline run end-to-end." />

      <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
        {ANPR_SAMPLES.map((s) => (
          <button key={s.id} onClick={() => setSelected(s)}
            className={`group rounded-xl border p-2.5 text-left transition ${selected?.id === s.id ? `border-${theme.c500} bg-${theme.c500}/10` : "border-slate-800 bg-slate-900/40 hover:border-slate-600"}`}>
            <div className={`relative h-16 w-full overflow-hidden rounded-lg bg-gradient-to-br ${s.gradient.replace("cyan-950", theme.c950)}`}>
              <div className="absolute inset-0 opacity-30" style={{ backgroundImage: "repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 6px)" }} />
              <div className="absolute bottom-1 left-1 rounded bg-slate-950/70 px-1 py-0.5 font-data text-[7px] text-slate-300">{s.plate}</div>
            </div>
            <div className="mt-2 text-[11px] font-medium text-slate-300">{s.label}</div>
          </button>
        ))}
      </div>

      <div className="grid gap-6 lg:grid-cols-5">
        <GlassCard className="p-5 lg:col-span-3">
          <div className="mb-3 flex items-center justify-between">
            <span className="font-data text-[11px] uppercase tracking-widest text-slate-500">Camera Frame Preview</span>
            {selected && <Badge tone={done ? "emerald" : "cyan"}>{done ? "Processed" : "Processing…"}</Badge>}
          </div>
          {!selected ? (
            <div className="flex h-64 flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-slate-700 text-slate-500">
              <Upload size={28} />
              <p className="text-sm">Select a sample above, or imagine dropping your own frame here</p>
            </div>
          ) : (
            <div className={`relative h-64 overflow-hidden rounded-xl bg-gradient-to-br ${selected.gradient.replace("cyan-950", theme.c950)}`}>
              <div className="absolute inset-0 opacity-25" style={{ backgroundImage: "repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 6px)" }} />
              {selected.condition === "Motion Blur" && <div className="absolute inset-0 backdrop-blur-[2px]" />}
              {/* mock vehicle silhouette */}
              <div className="absolute left-1/2 top-1/2 h-16 w-40 -translate-x-1/2 -translate-y-[60%] rounded-md bg-slate-950/40" />
              {/* plate */}
              <div className="absolute left-1/2 top-1/2 flex h-9 w-32 -translate-x-1/2 translate-y-2 items-center justify-center rounded-sm border-2 border-slate-300 bg-slate-50 font-data text-xs font-bold tracking-wider text-slate-900 shadow-lg">
                {selected.plate}
              </div>
              {/* bounding box after detection stage */}
              {stage >= 1 && (
                <div className="absolute left-1/2 top-1/2 h-12 w-40 -translate-x-1/2 translate-y-0.5 -translate-y-1">

                    <div key={i} className={`absolute ${pos} h-2.5 w-2.5 border-${theme.c300}`} />

        </GlassCard>

        <GlassCard className="p-5 lg:col-span-2">
          <span className="font-data mb-4 block text-[11px] uppercase tracking-widest text-slate-500">Pipeline Status</span>
          {!selected ? (

                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <Badge tone="emerald">State: TN — Tamil Nadu</Badge>
                    {selected.condition && <Badge tone="amber">Condition: {selected.condition}</Badge>}
                    <Badge tone="cyan">Checksum Valid</Badge>
                  </div>
                </div>
              )}
            </div>
          )}

      </div>
    </div>
  );
}

function TrajectoryTracking({ query, setQuery }) {
  const theme = React.useContext(ThemeContext);
  const [active, setActive] = useState(null);
  const [hoverIdx, setHoverIdx] = useState(null);

  const hits = useMemo(() => {
    const clean = query.replace(/\s+/g, "").toUpperCase();
    if (!clean) return null;
    return SAMPLE_TRAJECTORIES[clean] || generateRoute(clean);
  }, [query]);

  const samplePlates = Object.keys(SAMPLE_TRAJECTORIES);

  return (
    <div className="space-y-6">
      <SectionHeader eyebrow="Module 02" icon={Route} title="Single Plate Trajectory Tracking"
        desc="Search any plate to re-construct its cross-camera path — timestamps, cameras, speed and direction." />

      <GlassCard className="p-4">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-center">
          <div className="flex flex-1 items-center gap-2 rounded-lg border border-slate-700 bg-slate-950/70 px-3 py-2.5">
            <Search size={16} className="text-slate-500" />
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="e.g. TN 07 AB 1234"
              className="font-data w-full bg-transparent text-sm uppercase tracking-wide text-slate-100 placeholder:text-slate-600 focus:outline-none"
            />
          </div>
          <div className="flex flex-wrap gap-2">
            {samplePlates.map((p) => (
              <button key={p} onClick={() => setQuery(p)}
                className={`font-data rounded-md border border-slate-700 bg-slate-900/60 px-2.5 py-1.5 text-[11px] text-slate-400 transition hover:border-${theme.c500}/50 hover:text-${theme.c300}`}>
                {p.replace(/(TN\d{2})([A-Z]+)(\d+)/, "$1 $2 $3")}
              </button>
            ))}
          </div>
        </div>
      </GlassCard>

      {!hits ? (
        <GlassCard className="flex h-64 flex-col items-center justify-center gap-2 text-slate-500">
          <Crosshair size={26} />
          <p className="text-sm">Enter or pick a plate number to reconstruct its route</p>
        </GlassCard>
      ) : (
        <div className="grid gap-6 lg:grid-cols-5">
          <GlassCard className="p-4 lg:col-span-2">
            <div className="mb-3 flex items-center justify-between">
              <span className="font-data text-[11px] uppercase tracking-widest text-slate-500">Camera Hit Timeline</span>
              <Badge tone="cyan">{hits.length} hits</Badge>
            </div>
            <div className="max-h-[420px] space-y-1 overflow-y-auto pr-1">
              {hits.map((h, i) => {
                const c = CAM[h.camera];
                return (
                  <button key={i} onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)}
                    onClick={() => setActive(c.id)}
                    className={`flex w-full items-start gap-3 rounded-lg border p-3 text-left transition ${hoverIdx === i || active === c.id ? `border-${theme.c500}/50 bg-${theme.c500}/5` : "border-slate-800 bg-slate-950/40"}`}>
                    <div className="flex flex-col items-center pt-0.5">
                      <div className={`flex h-6 w-6 items-center justify-center rounded-full bg-${theme.c500}/15 font-data text-[10px] font-bold text-${theme.c300}`}>{i + 1}</div>
                      {i < hits.length - 1 && <div className="mt-1 h-6 w-px bg-slate-700" />}
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center justify-between gap-2">
                        <span className="truncate text-sm font-medium text-slate-200">{c.name}</span>
                        <span className={`font-data shrink-0 text-[11px] text-${theme.c400}`}>{h.time}</span>
                      </div>
                      <div className="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 font-data text-[10.5px] text-slate-500">
                        <span className="flex items-center gap-1"><MapPin size={10} />{c.id}</span>
                        <span className="flex items-center gap-1"><Gauge size={10} />{h.speed} km/h</span>
                        <span className="flex items-center gap-1"><BadgeCheck size={10} />{h.confidence}%</span>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </GlassCard>

          <GlassCard className="p-4 lg:col-span-3">
            <div className="mb-3 flex items-center justify-between">
              <span className="font-data text-[11px] uppercase tracking-widest text-slate-500">Reconstructed Route</span>
              <Badge tone="emerald">
                {(() => {
                  const [h1, m1] = hits[0].time.split(":").map(Number);
                  const [h2, m2] = hits[hits.length - 1].time.split(":").map(Number);
                  const mins = (h2 * 60 + m2) - (h1 * 60 + m1);
                  return `Span: ${mins >= 0 ? mins : mins + 1440} min`;
                })()}
              </Badge>
            </div>
            <CityMap highlightPath={hits} activeCamera={active} onNodeClick={setActive} height={440} />
          </GlassCard>
        </div>
      )}
    </div>
  );
}

                      <span className="flex items-center gap-1 font-data text-[11px] text-emerald-400"><CheckCircle2 size={13} /> Notified</span>

                      <button onClick={() => setNotified((s) => ({ ...s, [r.id]: true }))}

function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function ThemeSwitcher({ themeName, setThemeName, compact = false }) {
  return (
    <div className={`flex items-center gap-1.5 rounded-full border border-slate-800 bg-slate-900/60 p-1 ${compact ? "" : ""}`}>
      {Object.values(THEMES).map((t) => (
        <button
          key={t.key}
          onClick={() => setThemeName(t.key)}
          title={t.label}
          aria-label={`Switch to ${t.label} theme`}
          className={`flex h-6 w-6 items-center justify-center rounded-full transition ${themeName === t.key ? "ring-2 ring-slate-300 ring-offset-2 ring-offset-slate-950" : "opacity-60 hover:opacity-100"}`}
        >
          <span className={`h-3.5 w-3.5 rounded-full ${t.dot}`} />
        </button>
      ))}
    </div>
  );
}
